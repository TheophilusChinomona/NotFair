name: Deploy NotFair CMO

on:
  push:
    branches: [developer]
    paths:
      - "notfair-cmo/src/**"
      - "notfair-cmo/package.json"
      - "notfair-cmo/pnpm-lock.yaml"
      - "notfair-cmo/Dockerfile"
      - "notfair-cmo/next.config.ts"
      - ".github/workflows/deploy.yml"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/theophiluschinomona/notfair-cmo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: notfair-cmo
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and restart
        working-directory: /home/apps/server/apps/client/notfair-cmo
        run: |
          docker compose pull
          docker compose up -d --force-recreate
      - name: Wait for health
        run: |
          sleep 15
          docker inspect notfair-cmo-prod --format '{{.State.Health.Status}}'
          docker logs notfair-cmo-prod --tail 5
